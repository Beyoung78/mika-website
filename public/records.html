<!DOCTYPE html>

<style>
@font-face{font-family:Syne;font-weight:700;font-display:swap;src:url(assets/fonts/syne-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Syne;font-weight:800;font-display:swap;src:url(assets/fonts/syne-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"DM Serif Display";font-weight:400;font-display:swap;src:url(assets/fonts/dm-serif-display-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"DM Serif Display";font-style:italic;font-weight:400;font-display:swap;src:url(assets/fonts/dm-serif-display-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url(assets/fonts/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:url(assets/fonts/inter-latin-600-normal.woff2) format("woff2")}
:root{--bg:#09080E;--ink:#F5F2F8;--mute:#A39DB0;--pink:#FF4FA3;--aqua:#3FE0D0;--sl:clamp(150px,15vw,210px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}

/* ---------- section ---------- */
.rr{position:relative;padding:clamp(56px,8vw,110px) 0 clamp(40px,6vw,80px);overflow:hidden;isolation:isolate}
.rr::before{content:"";position:absolute;inset:0;z-index:-1;
  background:radial-gradient(60% 45% at 50% 34%,rgba(255,79,163,.16),transparent 70%),radial-gradient(40% 30% at 22% 30%,rgba(63,224,208,.10),transparent 70%),radial-gradient(40% 30% at 80% 28%,rgba(63,224,208,.08),transparent 70%)}
.rr-head{text-align:center;padding:0 20px;margin-bottom:clamp(26px,4vw,44px)}
.rr-k{font:800 12px/1 Syne,sans-serif;letter-spacing:.42em;color:var(--aqua);text-transform:uppercase}
.rr-h{font:400 clamp(40px,6.4vw,84px)/1 "DM Serif Display",serif;margin-top:14px;letter-spacing:-.01em}
.rr-h em{font-style:italic;color:var(--pink)}
.rr-s{color:var(--mute);margin-top:14px;font-size:15px}

/* rail */
.rail{position:relative;height:calc(var(--sl)*1.62 + 40px);touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.rail.drag{cursor:grabbing}
.bar{position:absolute;left:0;right:0;top:34px;height:7px;border-radius:4px;z-index:2;
  background:linear-gradient(180deg,#f4f4f8 0%,#9a98a6 35%,#4c4a57 60%,#c9c7d2 85%,#6d6b78 100%);
  box-shadow:0 6px 14px rgba(0,0,0,.6),0 0 22px rgba(255,79,163,.12)}
.bar::after{content:"";position:absolute;left:0;right:0;top:1px;height:1px;background:rgba(255,255,255,.75)}
.track{position:absolute;left:0;top:0;display:flex;gap:clamp(14px,1.8vw,26px);padding-left:20px;will-change:transform}
.it{position:relative;width:var(--sl);padding-top:30px;flex:none;--sw:0deg}
.hook{position:absolute;left:50%;top:22px;width:22px;height:26px;margin-left:-11px;z-index:3;pointer-events:none}
.hook::before{content:"";position:absolute;left:5px;top:0;width:12px;height:12px;border:2.5px solid #cfcdd8;border-bottom-color:transparent;border-radius:50%;transform:rotate(-20deg)}
.hook::after{content:"";position:absolute;left:3px;top:13px;width:16px;height:13px;border-radius:2px;background:linear-gradient(180deg,#e9e8ee,#8c8a97);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.sw{transform-origin:50% 0;transform:rotate(var(--sw));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.sl{position:relative;display:block;width:var(--sl);aspect-ratio:1;margin-top:18px;border-radius:3px;transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.2,.9,.25,1.25),filter .4s,box-shadow .5s;transform:perspective(900px) rotateX(0) rotateY(var(--ry,0deg)) translateZ(0);
  box-shadow:0 18px 30px -8px rgba(0,0,0,.75),0 4px 8px rgba(0,0,0,.5)}
.sl img{display:block;width:100%;height:100%;border-radius:3px;pointer-events:none}
.sl::after{content:"";position:absolute;inset:0;border-radius:3px;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.04) 28%,transparent 45%,transparent 70%,rgba(255,255,255,.07) 100%);mix-blend-mode:screen}
.tag{position:absolute;left:calc(50% + 14px);top:30px;z-index:4;font:800 10px/1 Syne,sans-serif;letter-spacing:.08em;background:#f5f2f8;color:#120f18;padding:5px 6px 4px;border-radius:2px;
  transform-origin:0 0;transform:rotate(9deg);box-shadow:0 3px 6px rgba(0,0,0,.45)}
.tag::before{content:"";position:absolute;left:-7px;top:-6px;width:9px;height:9px;border-left:1px solid #bbb;transform:rotate(-30deg)}
.rail.focus .it:not(.on) .sl{filter:brightness(.42) saturate(.7)}
.it.on{z-index:5}
.it.on .sl{transform:perspective(900px) rotateX(-6deg) rotateY(var(--ry,0deg)) translateZ(80px) scale(1.16);box-shadow:0 40px 60px -12px rgba(0,0,0,.9),0 0 50px rgba(255,79,163,.25)}
.sl{cursor:pointer}
.po{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;display:grid;place-items:center;z-index:3;pointer-events:none;
  background:rgba(255,79,163,.92);box-shadow:0 10px 30px rgba(255,79,163,.55),0 0 0 6px rgba(255,79,163,.18);opacity:0;transform:translateZ(30px) scale(.6);transition:opacity .3s,transform .45s cubic-bezier(.2,.9,.25,1.4)}
.po svg{width:24px;height:24px;fill:#120f18;margin-left:3px}
.it.on .po{opacity:1;transform:translateZ(30px) scale(1)}
.pb{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;z-index:2;pointer-events:none;
  background:rgba(9,8,14,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 0 0 1px rgba(255,255,255,.18);transition:opacity .25s}
.pb svg{width:11px;height:11px;fill:var(--pink);margin-left:2px}
.it.on .pb{opacity:0}
.cta{position:absolute;left:50%;top:calc(100% + 48px);transform:translate(-50%,6px);white-space:nowrap;font:800 10px/1 Syne,sans-serif;letter-spacing:.26em;text-transform:uppercase;color:var(--pink);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
.it.on .cta{opacity:1;transform:translate(-50%,0)}
.ring{position:absolute;left:0;top:18px;width:var(--sl);aspect-ratio:1;border-radius:4px;pointer-events:none;z-index:1;opacity:0}
.it.nudge .ring{animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{opacity:.9;box-shadow:0 0 0 0 rgba(255,79,163,.75)}100%{opacity:0;box-shadow:0 0 0 22px rgba(255,79,163,0)}}
.chip{position:absolute;left:50%;top:calc(100% + 16px);transform:translate(-50%,8px);white-space:nowrap;padding:9px 14px 8px;border-radius:30px;background:var(--pink);color:#120f18;
  font:800 10px/1 Syne,sans-serif;letter-spacing:.2em;text-transform:uppercase;box-shadow:0 10px 26px rgba(255,79,163,.45);opacity:0;transition:opacity .4s,transform .4s;pointer-events:none}
.chip::before{content:"";position:absolute;left:50%;top:-5px;width:10px;height:10px;margin-left:-5px;background:var(--pink);transform:rotate(45deg)}
.it.nudge .chip{opacity:1;transform:translate(-50%,0)}
.it.nudge .pb{opacity:0}
.it.nudge .po{opacity:1;transform:translateZ(30px) scale(1)}
.refl{position:absolute;left:0;right:0;bottom:0;height:50px;background:linear-gradient(180deg,rgba(255,255,255,.03),transparent);pointer-events:none}
.rr-cap{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;max-width:1240px;margin:clamp(6px,1.4vw,18px) auto 0;padding:0 24px;min-height:52px}
.cap-l b{display:block;font:400 clamp(22px,2.4vw,30px)/1.1 "DM Serif Display",serif}
.cap-l small{display:block;margin-top:6px;font:700 11px/1 Syne,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--aqua)}
.cap-r{display:inline-flex;align-items:center;gap:10px;font:700 11px/1 Syne,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);
  padding:12px 16px 11px;border:1px solid rgba(255,79,163,.45);border-radius:40px;background:rgba(255,79,163,.08)}
.cap-r i{width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 0 rgba(255,79,163,.7);animation:dot 1.6s infinite}
@keyframes dot{0%{box-shadow:0 0 0 0 rgba(255,79,163,.7)}100%{box-shadow:0 0 0 10px rgba(255,79,163,0)}}
.prog{max-width:1240px;margin:22px auto 0;padding:0 24px}
.prog div{height:2px;background:rgba(255,255,255,.12);border-radius:2px;position:relative;overflow:hidden}
.prog span{position:absolute;left:0;top:0;bottom:0;width:18%;background:var(--ink);border-radius:2px}

/* ---------- detail view ---------- */
.dv{position:fixed;inset:0;z-index:50;display:grid;place-items:center;visibility:hidden;opacity:0;transition:opacity .45s,visibility .45s;
  background:radial-gradient(70% 70% at 35% 45%,rgba(255,79,163,.18),transparent 60%),rgba(6,5,10,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.dv.open{visibility:visible;opacity:1}
.dv-in{position:relative;display:grid;grid-template-columns:auto clamp(320px,33vw,470px);gap:clamp(28px,3.4vw,56px);align-items:center;padding:30px}
.stage{position:relative;width:min(34vw,430px,62vh);aspect-ratio:1;perspective:1200px;margin-right:calc(min(34vw,430px,62vh)*.5)}
.big{position:absolute;inset:0;z-index:2;transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.8,.2,1);
  transform:rotateX(var(--tx,0deg)) rotateY(var(--ty,0deg));box-shadow:0 50px 80px -20px rgba(0,0,0,.95);border-radius:4px}
.big img{display:block;width:100%;height:100%;border-radius:4px}
.big::after{content:"";position:absolute;inset:0;border-radius:4px;pointer-events:none;background:linear-gradient(calc(115deg + var(--ty,0deg)*3),rgba(255,255,255,.25),transparent 40%,transparent 70%,rgba(255,255,255,.08))}
.vin{position:absolute;top:3%;left:3%;width:94%;aspect-ratio:1;border-radius:50%;z-index:1;transition:transform 1s cubic-bezier(.2,.8,.2,1);transform:translateX(0);
  background:radial-gradient(circle,#0b0b0e 0 17.5%,transparent 17.6%),repeating-radial-gradient(circle,#141317 0 1.2px,#0a090c 1.3px 2.6px),#0b0a0d;
  box-shadow:0 30px 60px rgba(0,0,0,.8),inset 0 0 0 2px #1a191e}
.vin::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,transparent 0 10%,rgba(255,255,255,.13) 14%,transparent 20% 50%,rgba(255,255,255,.09) 60%,transparent 66%)}
.dv.open .vin{transform:translateX(52%)}
.lbl{position:absolute;inset:32%;border-radius:50%;overflow:hidden;animation:spin 1.8s linear infinite;animation-play-state:paused;box-shadow:0 0 0 3px #111}
.lbl img{width:100%;height:100%;object-fit:cover}
.lbl::after{content:"";position:absolute;left:50%;top:50%;width:8%;height:8%;margin:-4% 0 0 -4%;border-radius:50%;background:#09080E}
.dv.play .lbl{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.info .no{font:800 12px/1 Syne,sans-serif;letter-spacing:.34em;color:var(--aqua)}
  .info h3{font:400 clamp(32px,3.6vw,54px)/1.02 "DM Serif Display",serif;margin:16px 0 10px}
.info .sub{color:var(--mute);font-size:15px}
.ctrl{display:flex;align-items:center;gap:16px;margin-top:30px}
.pp{width:64px;height:64px;border-radius:50%;background:var(--pink);display:grid;place-items:center;box-shadow:0 12px 30px rgba(255,79,163,.45);transition:transform .2s}
.pp:hover{transform:scale(1.06)}
.pp svg{width:24px;height:24px;fill:#120f18}
.time{flex:1}
.tbar{height:3px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden}
.tbar i{display:block;height:100%;width:0;background:var(--ink)}
.tt{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.links{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.links a{font:700 12px/1 Syne,sans-serif;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;padding:13px 18px;border:1px solid rgba(255,255,255,.22);border-radius:40px;transition:border-color .2s,background .2s}
.links a:hover{border-color:var(--aqua);background:rgba(63,224,208,.08)}
.links a.sp{background:#1DB954;border-color:#1DB954;color:#06150b}
.nav{display:flex;gap:10px;margin-top:34px}
.nav button,.x{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;font-size:18px;transition:border-color .2s}
.nav button:hover,.x:hover{border-color:var(--ink)}
.x{position:fixed;top:22px;right:22px;z-index:51}
.hint{margin-top:16px;font-size:12px;color:var(--mute)}
.side{display:flex;flex-direction:column;height:min(86vh,800px);min-height:0}
.info .ctrl{margin-top:24px}.info .links{margin-top:22px}
.nav{margin-top:0}
.lyw{position:relative;flex:1;min-height:0;margin-top:26px;padding-top:18px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column}
.lyh{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.lyh b{font:800 11px/1 Syne,sans-serif;letter-spacing:.34em;color:var(--aqua);text-transform:uppercase}
.lyh span{font-size:12px;color:var(--mute)}
.lys{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:28% 4px 46%;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 72%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 72%,transparent 100%)}
.lys::-webkit-scrollbar{display:none}
.lys h4{font:800 10px/1 Syne,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:var(--pink);margin:30px 0 12px;opacity:.85}
.lys h4:first-child{margin-top:0}
.lys p{font:400 clamp(21px,1.75vw,28px)/1.34 "DM Serif Display",serif;color:var(--ink);opacity:var(--o,.3);margin:0 0 7px;
  transform:translateX(calc((1 - var(--o,.3))*-6px));transition:opacity .35s,transform .35s,text-shadow .35s;cursor:default}
.lys .ch p{font-style:italic}
.lys p.lit{text-shadow:0 0 22px rgba(255,79,163,.55)}
.lys .note{font-size:12px;color:var(--mute);margin-top:30px;font-style:normal;opacity:.8}

@media (max-width:820px){
  .dv{place-items:start center;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .dv-in{grid-template-columns:1fr;gap:26px;padding:70px 22px 40px;justify-items:center;text-align:center}
  .side{height:auto;width:100%;max-width:440px}
  .lyw{flex:none;height:56vh;margin-top:30px}
  .lys{padding:22% 4px 40%}
  .lys p{transform:none;font-size:21px}
  .stage{width:min(50vw,230px)!important;margin-right:min(17vw,82px)!important}
  .info h3{font-size:34px;margin:10px 0 6px}
  .info .ctrl{margin-top:18px}.info .links{margin-top:16px;gap:8px;flex-wrap:nowrap;align-items:center}
  .links a{padding:12px 13px;font-size:11px;letter-spacing:.12em}
  .nav{gap:6px}.nav button{width:40px;height:40px}
  .lyw{margin-top:20px;height:60vh}
  .stage{width:min(58vw,280px);margin-right:min(20vw,100px)}
  .dv.open .vin{transform:translateX(36%)}
  .ctrl,.links,.nav{justify-content:center}
  .ctrl{width:100%;max-width:340px;margin-left:auto;margin-right:auto}
  .info{width:100%}
  .hint{display:none}
  .cap-r{display:none}
}
@media (prefers-reduced-motion:reduce){.sl,.sw,.vin,.big{transition:none}.lbl,.ring,.cap-r i{animation:none}}
</style>
</head>

<script>
const ITEMS=[{"id":"s00","t":"Break You Out","sub":"The single","f":"assets/deck/r00.mp3","label":"assets/img/t/single.webp","lyr":"lyrics/break-you-out.html","no":"★","ly":[["Cold open",["Put your sequins on, Grandma,","I'm gonna break you out tonight."]],["Hook",["Put your sequins on, Grandma,","I'm gonna break you out tonight,","They can lock every door in the building,","But they can't lock a voice inside.","One last song on Sunset,","Let me see you shine."]],["Verse 1",["Ruby Rae, eighty-four, room two-twelve,","Lost my name, lost the year, lost most of herself.","But hum her one old ballad and her shoulders come alive,","She's back on Sunset Boulevard, nineteen sixty-five.","Sang the Starlight Room six nights a week for years,","Sequins and a spotlight, grown men wiping tears.","Then I read it in the paper: Friday, it comes down,","Last night of the Starlight, condos in the ground.","Asked the nurse for one night. \"Visiting ends at nine.","Need a signature from family.\" Lady, that's mine.","\"Need her son.\" Her son's in Vegas and he never calls.","So I said thank you, ma'am, and I studied the halls."]],["Hook",["Put your sequins on, Grandma,","I'm gonna break you out tonight,","They can lock every door in the building,","But they can't lock a voice inside.","One last song on Sunset,","Let me see you shine."]],["Verse 2",["Friday, eight-fifty, scrubs I bought online,","Laundry cart, a garment bag, her dress from sixty-nine.","Service stairs, she's giggling underneath the sheets,","\"Honey, is this a robbery?\" \"Yeah, Grandma. Hold your seat.\"","Sunset in the rain, the old sign half alive,","Doorman saw the sequins, took his hat off, stepped aside.","Then the alarm at the home, twelve calls on my phone,","Blue lights on the window, but she walked in on her own."]],["Spoken",["She sat down at the piano.","She looked at me.","And she said my name. \"Mika.\"","First time in two years.","Then a cop walked through the door.","He looked at her. He looked at me.","And he sat down at the bar."]],["Bridge",["Moonlight on Sunset, don't you wait for me,","I'll be singing somewhere you can't see."]],["Final hook",["Put your sequins on, Grandma,","'Cause I broke you out tonight,","They can tear down every wall in the building,","But they can't tear down the light.","One last song on Sunset,","And, Grandma, you were shining."]],["Verse 3",["They knocked it down on Monday. She don't remember that.","But every night at nine, her fingers tap, tap, tap.","And the cop wrote \"family outing,\" signed it, let it be.","Sometimes the law's a man who still knows the melody."]],["Outro",["Put your sequins on, Grandma."]]]},{"id":"t01","t":"No Angel","sub":"No Angel. No Apology.","f":"assets/deck/t01.mp3","label":"assets/img/t/album.webp","lyr":"lyrics/no-angel.html","no":"01","ly":[["Intro",["You wanted an angel?","Wrong address, baby.","I came with a heartbeat,","a bad reputation","and absolutely no patience."]],["Verse 1",["I got sunshine dripping off the dashboard,","Bare feet, big dreams, never asked for the passport.","Daddy said, \"Baby, keep your head on straight,\"","But the world got crooked, so I learned to navigate.","I know nice guys with a pocket full of lies,","Big gold watches, little truth behind their eyes.","He said he wants a woman he can understand,","I said, \"Start by learning how to be a man.\"","I don't need a throne, I can sit on the floor,","I can walk out smiling while you're begging for more.","Got a little bit of chaos underneath this skin,","But I never blame the devil for the trouble I'm in."]],["Pre-Chorus",["Don't put a halo on my head,","I got things I never said.","I'm not broken, I'm not blessed,","I'm just beautifully a mess."]],["Chorus",["No angel, no apology,","You can't put a little cage around me.","Sweet face, sharp tongue, wild heart,","I was never made to play that part.","No angel, no alibi,","I tell the truth even when it bites.","Love me loud or leave me free,","You don't get to rewrite me."]],["Post-Chorus",["Not your girl, not your game,","Same old world, different name.","No halo, no disguise,","Read my lips, I don't compromise."]],["Verse 2",["I seen rich men cry in a rented-out suite,","And broke men dance with the whole damn street.","Funny how a dollar makes a stranger feel tall,","Till the lights go out and nobody calls.","I got friends who smile with a war in their chest,","People looking perfect but they never get rest.","Everybody's selling some version of a dream,","Nobody's asking what the silence really means.","So don't call me difficult, call me awake,","I know the difference between love and a mistake.","I can wear red lipstick, talk dirty, think deep,","And still have a soul that you don't get to keep."]],["Bridge",["Maybe I get scared when the room gets quiet,","Maybe I run when I should start a riot.","Maybe underneath this fearless show,","There's a girl who still has things to know."]],["Final Chorus",["No angel, no apology,","You can't put a little cage around me.","Sweet face, sharp tongue, wild heart,","I was never made to play that part.","No angel, no alibi,","I tell the truth even when it bites.","Love me loud or leave me free,","You don't get to rewrite me."]],["Outro",["And for the record...","I never asked to be your good girl."]]]},{"id":"t02","t":"Palm Trees & Bad Decisions","sub":"No Angel. No Apology.","f":"assets/deck/t02.mp3","label":"assets/img/t/album.webp","lyr":"lyrics/palm-trees-and-bad-decisions.html","no":"02","ly":[["Intro",["Miami, baby.","Where the rent is high,","the drinks are overpriced","and everybody's somebody.","Let's go."]],["Verse 1",["Two a.m., Ocean Drive, windows down,","He said he's a king in this part of town.","Got a rented Lambo and a borrowed chain,","Told me he's different, then he did the same.","I'm in the passenger seat, eating French fries,","Watching his reflection tell a thousand lies.","He says, \"You're trouble,\" like it's something new,","Honey, your therapist already knows about you.","Pink sky fading on the Biscayne Bay,","Everybody's got a price, everybody's got a play.","I could fall in love with the view tonight,","But the man in the mirror ain't looking right."]],["Chorus",["Palm trees and bad decisions,","Champagne dreams with no permission.","Kiss me once, then miss me twice,","Miami never gives advice.","Palm trees, headlights, midnight blue,","Everybody's got a story, I got two.","One for the morning, one for the night,","I make bad decisions look alright."]],["Verse 2",["He bought me roses, I bought my own ride,","He wants a girlfriend, I want the whole sky.","He says he's jealous when I dance alone,","I said, \"That's cute, but this ain't your home.\"","My best friend says I should settle down,","But she just booked a flight to another town.","We're all pretending that we're doing fine,","Taking pretty pictures while we're losing time.","And I ain't judging, I've made mistakes,","I've kissed the wrong lips for the right escape.","But life gets boring when you play it safe,","Just don't confuse a good night with a soulmate."]],["Pre-Chorus",["The ocean doesn't keep a secret,","The city doesn't care who sees it.","If tomorrow comes too soon,","We'll blame the stars and change the tune."]],["Chorus",["Palm trees and bad decisions,","Champagne dreams with no permission.","Kiss me once, then miss me twice,","Miami never gives advice.","Palm trees, headlights, midnight blue,","Everybody's got a story, I got two.","One for the morning, one for the night,","I make bad decisions look alright."]],["Bridge",["Maybe we're just scared of going home,","Scared of finding out we're still alone.","So we keep the music playing loud,","And disappear inside another crowd."]],["Final Chorus",["Palm trees and bad decisions,","Champagne dreams with no permission.","Kiss me once, then miss me twice,","Miami never gives advice.","Palm trees, headlights, midnight blue,","Everybody's got a story, I got two.","One for the morning, one for the night,","I make bad decisions look alright."]],["Outro",["And no, baby.","You cannot have my location."]]]},{"id":"t03","t":"Pretty Little Problem","sub":"No Angel. No Apology.","f":"assets/deck/t03.mp3","label":"assets/img/t/album.webp","lyr":"lyrics/pretty-little-problem.html","no":"03","ly":[["Intro",["You look nervous.","That's adorable.","Did I do that?"]],["Verse 1",["Walk in late with my coffee cold,","Black dress, cheap jokes, expensive soul.","You got a checklist, I got a life,","You want a perfect girl? Try an online wife.","I don't do drama, I just tell the truth,","You call it attitude, I call it proof.","You talk about loyalty, show me the math,","You want the whole ocean but can't handle the bath.","I know your type, got the same old speech,","Big ambition, little self-belief.","You want a woman who's a work of art,","But get uncomfortable when she thinks too hard."]],["Pre-Chorus",["You can try to figure me out,","But there's a reason I don't explain.","You keep looking for the exit,","Then you come right back again."]],["Chorus",["I'm your pretty little problem,","The one you can't solve.","Too much attitude,","Not enough control.","I'm your pretty little problem,","Your favorite mistake.","You wanted something easy,","Baby, look what you made.","Pretty little problem,","Pretty little problem.","You can't fix what you can't own,","I was trouble on my own."]],["Post-Chorus",["Can't fix me.","Can't script me.","Can't buy me.","Don't try me."]],["Verse 2",["I got a soft spot, don't mistake that,","I'll forgive a lot, won't forget the facts.","I can make you laugh when the world's on fire,","Then leave your ego hanging on a telephone wire.","My mother says I always had a spark,","A little too loud, a little too smart.","I used to think that I should tone it down,","Now I wear my flaws like a golden crown.","And here's the thing that nobody says,","Some of us smile while we're losing our way.","You see the lipstick, the lights, the show,","You never ask what we don't let go."]],["Pre-Chorus",["You can try to figure me out,","But there's a reason I don't explain.","You keep looking for the exit,","Then you come right back again."]],["Chorus",["I'm your pretty little problem,","The one you can't solve.","Too much attitude,","Not enough control.","I'm your pretty little problem,","Your favorite mistake.","You wanted something easy,","Baby, look what you made.","Pretty little problem,","Pretty little problem.","You can't fix what you can't own,","I was trouble on my own."]],["Bridge",["Sometimes I wish that I could stay,","Without feeling I should run away.","Sometimes I wish you'd see the girl,","Not just the chaos I bring to your world.","But I won't shrink to fit your hands,","I won't apologize for who I am.","PRETTY LITTLE PROBLEM Songtext, Fortsetzung"]],["Final Chorus",["I'm your pretty little problem,","The one you can't solve.","Too much attitude,","Not enough control.","I'm your pretty little problem,","Your favorite mistake.","You wanted something easy,","Baby, look what you made.","Pretty little problem,","Pretty little problem.","You can't fix what you can't own,","I was trouble on my own."]],["Outro",["Tell your friends I'm difficult.","They'll probably agree."]]]},{"id":"t04","t":"Rent Free in Your Head","sub":"No Angel. No Apology.","f":"assets/deck/t04.mp3","label":"assets/img/t/album.webp","lyr":"lyrics/rent-free-in-your-head.html","no":"04","ly":[["Hook",["I don't pay rent, but I'm living in your head,","You changed the locks, still you sleep in my bed.","You say you're over it, you say you're alright,","Funny how my name keeps you up every night."]],["Verse 1",["I heard you told your friends I'm hard to forget,","Funny, I was barely getting dressed.","You know my coffee, know my favorite song,","But somehow couldn't tell when something's wrong.","You kept my picture in a drawer downstairs,","Like I wouldn't notice that you still care.","You ask about me like it's casual news,","But your voice gets strange when they mention somebody new.","I don't need detectives, I can read a room,","You made a whole religion out of missing you.","And I ain't even mad, that's the funniest part,","You lost the girl and kept the souvenir heart."]],["Chorus",["I don't pay rent, but I'm living in your head,","You changed the locks, still you sleep in my bed.","You say you're over it, you say you're alright,","Funny how my name keeps you up every night.","You can close your eyes, you can turn away,","But memories don't listen when you tell them to behave.","I moved on quietly, you made a whole event,","Guess I'm doing pretty well, living rent free without paying","rent."]],["Verse 2",["You still wear that jacket that I said looked cheap,","Now it's designer just because I used to tease.","You got a new girl, hope she likes the view,","Of a man still checking what his ex might do.","Don't get it twisted, I wish you well,","I hope you find some peace outside yourself.","But if you tell her that I'm crazy again,","At least make it sound like a compliment.","I wasn't your lesson, I wasn't your prize,","Just two imperfect people with different alibis.","You wanted a mirror that would flatter your face,","I wanted a partner, not another case."]],["Breakdown",["Who pays? Not me.","Who stays? Not me.","Who's still awake at three?","Apparently not me."]],["Bridge",["I hope one day you remember me","Without needing to prove something.","Some people leave a mark,","Not a debt."]],["Final Chorus",["I don't pay rent, but I'm living in your head,","You changed the locks, still you sleep in my bed.","You say you're over it, you say you're alright,","Funny how my name keeps you up every night.","You can close your eyes, you can turn away,","But memories don't listen when you tell them to behave.","I moved on quietly, you made a whole event,","Guess I'm doing pretty well, living rent free without paying","rent."]],["Outro",["And please...","Stop asking my friends about me.","It's getting embarrassing."]]]},{"id":"r0 nd a millionaire upstairs wondering where his weekends","went.","One has holes inside her shoes, one has gold around his neck,","Both are staring at the ceiling with the same amount of stress.","I don't romanticize the struggle, I know bills don't disappear,","And a full fridge tastes different when you've been hungry for a","year.","Money matters, let's be honest, I like comfort, I like choice,","But I've heard a thousand people with a mansion and no voice.","Somebody's mother waits for calls that never come,","Somebody's father keeps pretending that he's having fun.","Somebody's chasing numbers like the finish line is near,","But you can't take your followers to the funeral, my dear."]],["Pre-Chorus",["What are we collecting?","What are we becoming?","All this running, running,","Where are we going?"]],["Chorus",["You can buy the lights,","You can buy the gold,","You can fill a house","But you can't buy a soul.","You can own the night,","You can run the town,","But money can't buy a pulse","When the heart shuts down."]],["Post-Chorus",["Tell me, what's the price","Of a hand that stays?","What's a thousand nights","If nobody knows your name?","You can have it all,","Still be all alone.","Money buys a palace,","It can't make it a home."]],["Bridge",["I want the kind of rich","That doesn't make the news.","A kitchen full of laughter,","And someone I can lose.","I want a table crowded,","A phone that doesn't ring","Because the people that I love","Are already listening."]],["Final Chorus",["You can buy the lights,","You can buy the gold,","You can fill a house","But you can't buy a soul.","You can own the night,","You can run the town,","But money can't buy a pulse","When the heart shuts down."]],["Outro",["I like nice things too.","I'm just not stupid enough","to think they're people."]]]},{"id":"t06","t":"Don't Test the Lipstick","sub":"No Angel. No Apology.","f":"assets/deck/t06.mp3","label":"assets/img/t/album.webp","lyr":"lyrics/dont-test-the-lipstick.html","no":"06","ly":[["Intro",["Red on my lips, got a lot on my mind,","You got opinions? Get in line."]],["Hook",["Don't test the lipstick,","Don't push your luck.","I look like a sweetheart,","But I don't give a...","Don't test the lipstick,","Don't test the girl.","I came with my own keys,","I don't need your world."]],["Verse 1",["He said, \"Baby, you should smile a little more,\"","I said, \"Baby, you should find another door.\"","He said, \"I like a girl who's easy to impress,\"","I said, \"Then go date a motivational desk.\"","Got a fresh set, fresh fit, fresh attitude,","You got a podcast and a questionable mood.","You tell me how to dress, how to speak, how to move,","Honey, I'm not a project you can put in a room.","I like my coffee strong, my boundaries clear,","And my favorite kind of man doesn't interfere.","You can open the door, you can carry the bags,","But don't confuse good manners with a reason to brag."]],["Hook",["Don't test the lipstick,","Don't push your luck.","I look like a sweetheart,","But I don't give a...","Don't test the lipstick,","Don't test the girl.","I came with my own keys,","I don't need your world."]],["Verse 2",["I got a little black dress and a complicated brain,","Can dance in the rain and remember your name.","I can talk about art, I can talk about rent,","I can read your whole character in the way that you spend.","I don't need permission for a seat at the table,","I can change a tire and still look fabulous.","I can laugh at myself, that's a beautiful skill,","If you can't take a joke, you can pay your own bill.","You got a lot of rules for somebody so lost,","Counting everybody else's choices and the cost.","I got better things to do with my Saturday night,","Like making bad decisions that feel perfectly right."]],["Breakdown",["Who's got the keys?","I got the keys.","Who's paying the bill?","I got the bill.","Who's making the rules?","Not you, sweetie.","Who's still having fun?","Me. Obviously."]],["Hook",["Don't test the lipstick,","Don't push your luck.","I look like a sweetheart,","But I don't give a...","Don't test the lipstick,","Don't test the girl.","I came with my own keys,","I don't need your world."]],["Outro",["Red on my lips, got a lot on my mind,","You got opinions? Get in line.","And honey?","Your shirt needs ironing."]]]},{"id":"t07","t":"Girls Like Me Get Lonely Too","sub":"No Angel. No Apology.","f":"assets/deck/t07.mp3","label":"assets/img/t/album.webp","lyr":"lyrics/girls-like-me-get-lonely-too.html","no":"07","ly":[["Chorus",["Girls like me get lonely too,","Even with a thousand things to do.","I can fill a room, I can steal the view,","But there's nights I wish somebody knew.","I make it look like nothing gets through,","Like I never miss what I used to lose.","Everybody thinks I always pull through,","But girls like me get lonely too."]],["Verse 1",["There's a coffee cup still sitting by the sink,","A half-written message that I never hit send.","I put on my favorite record just to hear some noise,","Funny how a crowded song can't replace a voice.","I know how to make an entrance,","Know how to leave with style.","Know how to keep a conversation","Going for another mile.","But I don't always know what to do","When the evening gets too quiet.","I can handle almost anything,","Except the things I keep inside it."]],["Pre-Chorus",["Somewhere between the lights and the silence,","I lose track of who I am.","Somewhere underneath the confidence,","I'm still figuring out the plan."]],["Verse 2",["I got a picture of my mother on my phone,","She always asks if I'm eating, if I'm sleeping alone.","I tell her everything's beautiful, the weather's just right,","Then change the subject before she hears it in my voice.","My friends are getting married, having babies, buying homes,","I'm collecting airport stamps and learning to be grown.","I don't regret the roads that brought me where I stand,","But sometimes I would trade the world for someone's hand.","And maybe that's the part we never show,","The little cracks beneath the afterglow.","You can love your freedom, love the open sea,","And still wish somebody was waiting up for you at three."]],["Chorus",["Girls like me get lonely too,","Even with a thousand things to do.","I can fill a room, I can steal the view,","But there's nights I wish somebody knew.","I make it look like nothing gets through,","Like I never miss what I used to lose.","Everybody thinks I always pull through,","But girls like me get lonely too."]],["Bridge",["I don't need saving,","I don't need a plan.","I don't need somebody","To tell me who I am.","I just want a moment","Where I don't have to shine.","Where somebody sees me","And doesn't ask me to be fine."]],["Final Chorus",["Girls like me get lonely too,","Even with a thousand things to do.","I can fill a room, I can steal the view,","But there's nights I wish somebody knew.","Maybe I'm stronger than I ever knew,","Maybe that's not something I need to prove.","I can love this life and still miss you,","Girls like me get lonely too."]],["Outro",["And tomorrow I'll probably wear red lipstick","and pretend I slept eight hours."]]]},{"id":"r02","t":"Break You Out","sub":"Ibiza Melodic House Mix","f":"assets/deck/r02.mp3","label":"assets/img/t/remix.webp","lyr":"lyrics/break-you-out.html","no":"R2","ly":[["Cold open",["Put your sequins on, Grandma,","I'm gonna break you out tonight."]],["Hook",["Put your sequins on, Grandma,","I'm gonna break you out tonight,","They can lock every door in the building,","But they can't lock a voice inside.","One last song on Sunset,","Let me see you shine."]],["Verse 1",["Ruby Rae, eighty-four, room two-twelve,","Lost my name, lost the year, lost most of herself.","But hum her one old ballad and her shoulders come alive,","She's back on Sunset Boulevard, nineteen sixty-five.","Sang the Starlight Room six nights a week for years,","Sequins and a spotlight, grown men wiping tears.","Then I read it in the paper: Friday, it comes down,","Last e 1",["Valet parking, borrowed car,","Everybody here believes they're a star.","Gold on the wrist, champagne on ice,","Half of them are broke but the outfits look nice.","There's a guy at the bar with a rented-out smile,","Telling strangers that he's closing deals overseas for a while.","His friend took a selfie with a private jet,","It was parked at the airport, they ain't boarded yet.","A girl in the bathroom is fixing her crown,","Says she's got a million followers all over town.","I said, \"That's impressive, congratulations, girl,\"","She said, \"I'm going viral in another world.\""]],["Chorus",["There ain't no saints in South Beach,","Everybody's got a little something to hide.","Some are selling dreams, some are buying lies,","Some just came to dance and forget the time.","No saints in South Beach,","Everybody's playing their part.","Gold-plated dreams and a secondhand heart,","Welcome to the show, baby, enjoy the dark."]],["Verse 2",["The DJ knows the owner, the owner knows the mayor,","The mayor knows a guy who says he knows a billionaire.","Everybody's connected, everybody's important,","Nobody remembers who ordered the assortment.","A man says he's spiritual, he's found his inner peace,","Then gets into a fight over a table and a seat.","A girl says she's humble, but her phone needs a team,","Three assistants helping her to post that she's serene.","And me? I'm just here with a drink and a view,","Trying to remember if I actually like you.","I came for the music, stayed for the fries,","Left with a story and somebody else's advice."]],["Chorus",["There ain't no saints in South Beach,","Everybody's got a little something to hide.","Some are selling dreams, some are buying lies,","Some just came to dance and forget the time.","No saints in South Beach,","Everybody's playing their part.","Gold-plated dreams and a secondhand heart,","Welcome to the show, baby, enjoy the dark."]],["Bridge",["I ain't judging, I got my own little mess,","I once wore heels to a beach and called it progress.","I bought a plant and forgot it needed rain,","Now it's looking at me like we're going through pain.","We're all a little ridiculous, let's be real,","Some hide behind a label, some behind a steering wheel.","If you got a good heart, you can stay in my section,","Just don't ask me for a business connection."]],["Final Chorus",["There ain't no saints in South Beach,","Everybody's got a little something to hide.","Some are selling dreams, some are buying lies,","Some just came to dance and forget the time.","No saints in South Beach,","Everybody's playing their part.","Gold-plated dreams and a secondhand heart,","Welcome to the show, baby, enjoy the dark."]],["Outro",["Same time tomorrow?","Obviously.","I know a guy."]]]},{"id":"t09","t":"Mama Didn't Raise a Fool","sub":"No Angel. No Apology.","f":"assets/deck/t09.mp3","label":"assets/img/t/album.webp","lyr":"lyrics/mama-didnt-raise-a-fool.html","no":"09","ly":[["Intro",["She used to say,","\"Don't let a pretty room","make you forget who opened the door.\"","I didn't understand it then.","I do now."]],["Verse 1",["She could stretch a little money through a whole damn week,","Make a Sunday dinner with whatever we could keep.","Never had a diamond, never chased a name,","But everybody knew her when she walked into a place.","She said, \"Listen when they talk, but watch what they do,","A lot of people sell a version that ain't really true.\"","She taught me how to stand up, how to hold my ground,","And how to leave a room without making a sound.","She wasn't always right, and neither was I,","We had those little battles where we'd both get loud.","But every time I thought that I knew everything,","She'd say one little sentence that would change a thing."]],["Chorus",["Mama didn't raise a fool,","Though I gave her quite a few reasons to worry.","I learned the hard way, broke a few rules,","But I always had a way back to the truth."]],["Verse 2",["She said, \"Never let a man become your whole direction,","Love is not a job where you beg for his attention.","And don't confuse a loud voice with a man who's strong,","Sometimes the quiet ones know where they belong.\"","She said, \"Be kind, but don't be everybody's floor,","You can forgive somebody and still close the door.","Don't count your blessings by the things you own,","A full bank account can't keep you warm at home.\"","I broke some promises, I missed a few signs,","I gave the wrong people too much of my time.","I thought being grown meant I had to know it all,","Turns out being grown means you can admit when you fall."]],["Chorus",["Mama didn't raise a fool,","Though I gave her quite a few reasons to worry.","I learned the hard way, broke a few rules,","But I always had a way back to the truth."]],["Verse 3",["I remember little things that nobody sees,","Her singing in the kitchen, dancing while she cleaned.","The way she'd fix my collar before I left the house,","Then pretend she wasn't worried when I went out.","I didn't know the strength it took to keep us steady,","How many dreams she postponed to make sure we were ready.","Now I hear her in my head when I get carried away,","And sometimes I laugh because I sound just the same.","I don't want her life, I want her kind of grace,","The courage to be honest when the world changes face.","And if I ever raise a child, I hope they learn from me","That being strong means knowing when to let yourself be free."]],["Bridge",["I wish I could go back","To that little kitchen light,","Tell her all the things","I understand tonight.","That every little warning","Was a gift I couldn't see,","And every time she held her ground,","She was teaching me to be me."]],["Final Chorus",["Mama didn't raise a fool,","Though I gave her quite a few reasons to worry.","I learned the hard way, broke a few rules,","But I always had a way back to the truth."]],["Coda",["And if I ever lose my way,","I'll remember what she used to say.","You don't have to win every fight,","Just make sure you can sleep at night."]],["Outro",["She still thinks I should call more often.","She's probably right."]]]},{"id":"t10","t":"Pretty When I'm Pissed","sub":"No Angel. No Apology.","f":"assets/deck/t10.mp3","label":"assets/img/t/album.webp","lyr":"lyrics/pretty-when-im-pissed.html","no":"10","ly":[["Intro",["Cute little smile,","Bad little mood,","You had your chance,","Now watch me move."]],["Hook",["I'm pretty when I'm pissed,","Even better when I'm done.","You can talk your little talk,","I can walk before you run.","Got a face like Sunday morning,","Got a mouth like Friday night.","You should've read the room, sweetheart,","Before you picked this fight."]],["Verse 1",["You came in acting like the CEO,","Of a relationship you don't even know.","Got a five-year plan for my career,","Can't plan a weekend without disappearing.","You correct my words, you interrupt my jokes,","Tell everybody how a real woman behaves.","Funny how you preach about respect all day,","Then talk to the waiter like he's in your way.","I've met your kind in every expensive bar,","Little Napoleon in a borrowed sports car.","You got big opinions, tiny listening skills,","And the emotional range of a parking bill."]],["Hook",["I'm pretty when I'm pissed,","Even better when I'm done.","You can talk your little talk,","I can walk before you run.","Got a face like Sunday morning,","Got a mouth like Friday night.","You should've read the room, sweetheart,","Before you picked this fight."]],["Verse 2",["I don't need a committee, don't need your review,","Don't need a little man explaining what I should do.","My shoes cost less than your insecurity,","And my worst day still comes with maturity.","You say I'm intimidating, that's interesting news,","I'm only complicated when I'm talking to you.","You call me too much, I call you underprepared,","You brought a plastic spoon to a knife fight, that's unfair.","And I can be sweet, I can make you a plate,","Remember your birthday, show up on time.","But kindness ain't a coupon you can use for abuse,","And being nice doesn't mean I'm confused."]],["Spoken",["Hold up.","Did you just explain my own opinion to me?","That's adorable.","Try again."]],["Breakdown",["One for the ego, two for the show,","Three for the man who won't take a no.","Four for the stories you tell your friends,","Five for the fact that this conversation ends."]],["Final Hook",["I'm pretty when I'm pissed,","Even better when I'm done.","You can talk your little talk,","I can walk before you run.","Got a face like Sunday morning,","Got a mouth like Friday night.","You should've read the room, sweetheart,","Before you picked this fight."]],["Outro",["Lip gloss intact.","Patience officially discontinued."]]]},{"id":"r03","t":"Break You Out","sub":"Concrete Techno Mix","f":"assets/deck/r03.mp3","label":"assets/img/t/remix.webp","lyr":"lyrics/break-you-out.html","no":"R3","ly":[["Cold open",["Put your sequins on, Grandma,","I'm gonna break you out tonight."]],["Hook",["Put your sequins on, Grandma,","I'm gonna break you out tonight,","They can lock every door in the building,","But they can't lock a voice inside.","One last song on Sunset,","Let me see you shine."]],["Verse 1",["Ruby Rae, eighty-four, room two-twelve,","Lost my name, lost the year, lost most of herself.","But hum her one old ballad and her shoulders come alive,","She's back on Sunset Boulevard, nineteen sixty-five.","Sang the Starlight Room six nights a week for years,","Sequins and a spotlight, grown men wiping tears.","Then I read it in the paper: Friday, it comes down,","Last night of the Starlight, condos in the ground.","Asked the nurse for one night. \"Visiting ends at nine.","Need a signature from family.\" Lady, that's mine.","\"Need her son.\" Her son's in Vegas and he never calls.","So I said thank you, ma'am, and I studied the halls."]],["Hook",["Put your sequins on, Grandma,","I'm gonna break you out tonight,","They can lock every door in the building,","But they ere the truth appears,","Who remembers what I said when nobody hears?"]],["Pre-Chorus",["Don't promise me the moon,","Just show up when it rains.","Don't paint me something perfect,","Just don't disappear again."]],["Chorus",["Love me like you mean it,","Not just when the lights are low.","Not just when the world is easy,","Not just when there's somewhere to go.","Love me in the ordinary,","In the silence, in the mess.","I don't need a perfect lover,","Just somebody who means yes."]],["Verse 2",["Know my coffee, know my favorite side of town,","Know when I get quiet, don't just turn the music up loud.","Ask me how I'm doing and wait for the reply,","Don't just kiss my forehead while you're looking at the time.","I don't want a keeper, I don't want a king,","I want somebody comfortable with ordinary things.","A Sunday in the kitchen, dancing out of tune,","Two people being honest in a badly painted room.","And I can give you laughter, I can give you fire,","I can make a little magic out of cheap red wine.","But don't mistake my freedom for a lack of need,","Even wild things appreciate a place to breathe."]],["Chorus",["Love me like you mean it,","Not just when the lights are low.","Not just when the world is easy,","Not just when there's somewhere to go.","Love me in the ordinary,","In the silence, in the mess.","I don't need a perfect lover,","Just somebody who means yes."]],["Mid-Eight",["Not the picture, not the show,","Not the words you say for everyone to know.","Something honest, something true,","Something I can feel when I'm alone with you."]],["Bridge",["When my hair is a mess,","When my plans fall apart,","When I have nothing clever","To protect my heart.","When the city goes quiet,","And the morning comes through,","Will I still feel wanted","Just sitting next to you?"]],["Final Chorus",["Love me like you mean it,","Not just when the lights are low.","Not just when the world is easy,","Not just when there's somewhere to go.","Love me in the ordinary,","In the silence, in the mess.","I don't need a perfect lover,","Just somebody who means yes."]],["Outro",["I can buy my own flowers.","I'd just rather grow something together."]]]},{"id":"t12","t":"Bad Habit with a Heart","sub":"No Angel. No Apology.","f":"assets/deck/t12.mp3","label":"assets/img/t/album.webp","lyr":"lyrics/bad-habit-with-a-heart.html","no":"12","ly":[["Intro",["I have a talent for leaving my keys","in places I don't remember.","Apparently, people too."]],["Verse 1",["I'm the girl who says five minutes, then arrives at nine,","Got a calendar full of plans and a questionable sense of time.","I'll remember your birthday, forget where I parked,","And send you a voice note when it's already dark.","I buy books about habits, never finish the page,","Got a passport full of stamps and a fear of staying in one place.","My friends say I'm a handful, I say that's fair,","At least I'm never boring when I'm sitting in a chair.","I can make a stranger laugh in a checkout line,","Turn a wrong direction into a pretty good night.","But when somebody gets close and the feelings get real,","Sometimes I make a joke instead of saying what I feel."]],["Chorus",["I'm a bad habit with a heart,","A little bit of chaos, a little bit of art.","You might need a warning before you start,","But there's more to this girl than the way she departs."]],["Verse 2",["I once drove forty minutes for a sandwich I saw online,","Got there, they were closed, still called it a good time.","I've got expensive taste and a practical mind,","I'll spend twenty on dinner, save ten on the wine.","I can be stubborn, I'll admit that much,","Sometimes I need a minute before I let somebody touch","The little things I keep behind the jokes I make,","The parts of me that don't know which road to take.","And I've said goodbye when I should've stayed,","I've made a mountain out of something somebody said.","But I don't walk around pretending I'm a saint,","I know my little messes, I just don't call them fate."]],["Chorus",["I'm a bad habit with a heart,","A little bit of chaos, a little bit of art.","You might need a warning before you start,","But there's more to this girl than the way she departs."]],["Bridge",["I don't always say the right thing,","Sometimes I laugh when I should cry.","Sometimes I need the whole damn ocean","Just to understand the tide.","But I remember little kindness,","I remember who was there.","I remember every conversation","When somebody really cared.","I might lose my favorite earrings,","Miss a flight or change my mind,","But I'll never forget the people","Who were good to me in difficult times."]],["Final Chorus",["I'm a bad habit with a heart,","A little bit of chaos, a little bit of art.","I might take the scenic road and miss the start,","But there's always something honest underneath this heart."]],["Coda",["I'm not a finished picture,","I'm not a perfect part.","Just a girl with a thousand stories","And a pretty complicated heart."]],["Outro",["I did warn you.","Well... eventually."]]]},{"id":"r04","t":"Break You Out","sub":"Indie Dance Freak Mix","f":"assets/deck/r04.mp3","label":"assets/img/t/remix.webp","lyr":"lyrics/break-you-out.html","no":"R4","ly":[["Cold open",["Put your sequins on, Grandma,","I'm gonna break you out tonight."]],["Hook",["Put your sequins on, Grandma,","I'm gonna break you out tonight,","They can lock every door in the building,","But they can't lock a voice inside.","One last song on Sunset,","Let me see you shine."]],["Verse 1",["Ruby Rae, eighty-four, room two-twelve,","Lost my name, lost the year, lost most of herself.","But hum her one old ballad and her shoulders come alive,","She's back on Sunset Boulevard, nineteen sixty-five.","Sang the Starlight Room six nights a week for years,","Sequins and a spotlight, grown men wiping tears.","Then I read it in the paper: Friday, it comes down,","Last night of the Starlight, condos in the ground.","Asked the nurse for one night. \"Visiting ends at nine.","Need a s the change.","Hands up, windows down,","Let the whole world spin around.","If we're only here for a little while,","Give me one more reason to smile."]],["Verse 1",["Got my shades on crooked, got my hair in a mess,","Got a tank full of dreams and a dress from a sale.","My neighbor's got a yacht, my landlord wants the rent,","But I'm dancing in the kitchen like the money's already spent.","There's a girl on the corner selling flowers in the heat,","A man in a Ferrari looking miserable in his seat.","Everybody's chasing something they can never quite define,","I'm just trying to catch a little happiness before the closing","time.","I don't need a perfect picture, don't need a golden frame,","I've had some beautiful disasters that I wouldn't trade away.","If the road gets ugly, put the music on instead,","Life is way too short to let a stranger live inside your head."]],["Hook",["Everybody wants the sunshine,","Nobody wants the rain.","Everybody wants the good life,","Nobody wants the change.","Hands up, windows down,","Let the whole world spin around.","If we're only here for a little while,","Give me one more reason to smile."]],["Verse 2",["I got a little bit of trouble and a whole lot of plans,","A questionable tan and some very good friends.","Got a suitcase half-packed, got a flight to catch,","Got a heart that still believes in a beautiful mismatch.","Somebody wants a mansion, somebody wants fame,","Somebody wants a woman they can put inside a frame.","I want a little freedom and a table full of food,","And a man who doesn't call himself a gift to the world, dude.","I know the bills keep coming, I know the world's unfair,","But there's still a little magic in the warm Atlantic air.","So if you find me laughing with my feet out the door,","I'm not running from my problems, I'm just giving them a tour."]],["Bridge",["Sunshine on my shoulders,","Good times getting closer.","Don't need to be somebody,","I'm already getting older."]],["Final Hook",["Everybody wants the sunshine,","Nobody wants the rain.","Everybody wants the good life,","Nobody wants the change.","Hands up, windows down,","Let the whole world spin around.","If we're only here for a little while,","Give me one more reason to smile.","Everybody wants the sunshine,","Everybody wants to shine.","I don't need a perfect lifetime,","Just a little peace of mind."]],["Outro",["And please...","Put some sunscreen on.","I'm not your mother."]]]},{"id":"t14","t":"The Girl in the Rearview","sub":"No Angel. No Apology.","f":"assets/deck/t14.mp3","label":"assets/img/t/album.webp","lyr":"lyrics/the-girl-in-the-rearview.html","no":"14","ly":[["Verse 1",["There's a girl in the rearview with a suitcase full of dreams,","She thought the world was kinder than it really seemed.","She wore her mother's old advice like a coat in the rain,","And thought that being fearless meant she'd never feel pain.","She took the wrong exits, made the wrong calls,","Learned that pretty words don't build very strong walls.","She trusted a smile, believed a few lies,","Then learned how to read the truth behind somebody's eyes."]],["Pre-Chorus",["I wonder if she'd recognize the woman driving now,","Would she like the little scars? Would she ask me how?","Would she laugh at all the things I thought I'd never be?","Would she be a little proud of what she sees?"]],["Chorus",["I see her in the rearview,","Still waving from behind.","She never really left me,","She's just a different kind of light.","I can't go back and save her,","Can't change the things she's been through.","But every road that broke me","Led me somewhere new."]],["Verse 2",["I used to think that growing up meant never looking back,","Never showing weakness, never losing track.","But life has a funny way of changing what you know,","Sometimes you have to lose the map to find a place called","home.","I've got apologies I owe, some people I forgive,","Some versions of myself I wouldn't want to relive.","I've got photographs of summers that I barely recognize,","And names that still can find me when I'm trying to close my","eyes.","But I don't hate the girl who made those choices then,","She was doing what she could with the information she had.","And if I meet her somewhere on a road I haven't seen,","I'll tell her she's allowed to be a little more than brave."]],["Chorus",["I see her in the rearview,","Still waving from behind.","She never really left me,","She's just a different kind of light.","I can't go back and save her,","Can't change the things she's been through.","But every road that broke me","Led me somewhere new."]],["Verse 3",["And I won't pretend that every scar is beautiful,","Some things hurt because they happened, not because they're","useful.","Some nights I still remember what I thought I'd be,","Some mornings I'm just grateful that I'm finally me.","I don't owe my past a prison, don't owe my future fear,","I can carry all my stories without keeping them too near.","If the girl behind me asks if everything turned out right,","I'll say, \"Not always, baby. But we made it through the night.\""]],["Bridge",["If I could hold her for a minute,","I'd tell her not to rush.","You don't have to become somebody","Just because the world says you must."]],["Final Chorus",["I see her in the rearview,","Still waving from behind.","She never really left me,","She's just a different kind of light.","I can't go back and save her,","Can't change the things she's been through.","But every road that broke me","Led me somewhere new."]],["Coda",["And if tomorrow finds me","With another road to choose,","I'll keep the girl beside me,","I won't leave her in the rearview."]],["Outro",["We're alright, little girl.","We're alright."]]]},{"id":"r05","t":"Break You Out","sub":"Minimal Hypno Mix","f":"assets/deck/r05.mp3","label":"assets/img/t/remix.webp","lyr":"lyrics/break-you-out.html","no":"R5","ly":[["Cold open",["Put your sequins on, Grandma,","I'm gonna break you out tonight."]],["Hook",["Put your sequi ear down the light.","One last song on Sunset,","And, Grandma, you were shining."]],["Verse 3",["They knocked it down on Monday. She don't remember that.","But every night at nine, her fingers tap, tap, tap.","And the cop wrote \"family outing,\" signed it, let it be.","Sometimes the law's a man who still knows the melody."]],["Outro",["Put your sequins on, Grandma."]]]},{"id":"t15","t":"Still Here, Still Trouble","sub":"No Angel. No Apology.","f":"assets/deck/t15.mp3","label":"assets/img/t/album.webp","lyr":"lyrics/still-here-still-trouble.html","no":"15","ly":[["Intro",["You thought I'd disappear?","That's a cute little theory."]],["Hook",["Still here, still trouble,","Still dancing through the rubble.","Still got fire in my eyes,","Still got stories you can't buy.","Still here, still standing,","Still got dreams that demand it.","You can love me, you can run,","But I'm not finished, not even close to done."]],["Verse 1",["I came in with a suitcase and a head full of noise,","A couple of bad decisions and a dangerous voice.","Had a map with no direction, had a heart with no brakes,","Had to learn that not everybody deserves what it takes.","I've been broke, been lucky, been both in the same week,","Been the loudest in the room, been the one who couldn't speak.","I've watched people change when the money came around,","I've watched the quiet ones become the strongest in the crowd.","I don't need a little statue with my name on the side,","I just want to look back and know I never lived a lie.","If I made a few mistakes, I can own every one,","I'm not waiting for permission to become someone."]],["Hook",["Still here, still trouble,","Still dancing through the rubble.","Still got fire in my eyes,","Still got stories you can't buy.","Still here, still standing,","Still got dreams that demand it.","You can love me, you can run,","But I'm not finished, not even close to done."]],["Verse 2",["I got lipstick in the glove box, sneakers in the back,","A thousand little memories and a questionable past.","I got friends who know my secrets, know the things I never say,","And a mother who still thinks I should call every day.","I've made peace with my reflection, we don't argue quite as much,","Still got a little attitude, still don't like to rush.","I can walk into a room without pretending to be tall,","I can laugh at my own jokes when nobody laughs at all.","And if the world gets heavy, I'll put rhythm in my feet,","Turn a bad day into music, let the bassline take the heat.","I don't have to be a legend, don't have to be adored,","Just don't tell me how to live while you're standing at my door."]],["Bridge",["Oh, I've been through it,","I've grown through it.","Lost a few things,","But I came through it.","No perfect ending,","No easy road.","Just a heart still beating","And a story still untold."]],["Verse 3",["So here's to the nights that we barely survived,","To the wrong turns that somehow kept us alive.","To the people who stayed when the pretty lights died,","And the ones who walked away when we needed them beside.","I don't carry every wound like a badge on my chest,","I don't need to win the argument to know what's best.","I've got love in my heart and some fight in my soul,","And I learned that being free means you're nobody's role."]],["Hook",["Still here, still trouble,","Still dancing through the rubble.","Still got fire in my eyes,","Still got stories you can't buy.","Still here, still standing,","Still got dreams that demand it.","You can love me, you can run,","But I'm not finished, not even close to done."]],["Final Hook",["Still here, still trouble,","Still shining through the struggle.","Not a saint, not a queen,","Just the woman that I came here to be."]],["Outro",["They wanted an angel.","They got Mika.","And honestly...","I think we're both better off."]]]}];
